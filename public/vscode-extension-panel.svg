<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 360" fill="none" role="img" aria-label="Vista previa del panel lateral de la extensión GitSOS en VS Code">
  <defs>
    <linearGradient id="panelBg" x1="0" y1="0" x2="480" y2="360" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>
  </defs>

  <!-- Marco ventana VS Code -->
  <rect x="1" y="1" width="478" height="358" rx="12" fill="url(#panelBg)" stroke="#334155" stroke-width="2" />

  <!-- Activity Bar izquierda -->
  <rect x="2" y="2" width="46" height="356" rx="10" fill="#0b1120" />
  <line x1="48" y1="2" x2="48" y2="358" stroke="#1e293b" stroke-width="1" />

  <!-- Ícono Explorador (inactivo) -->
  <rect x="15" y="22" width="18" height="22" rx="2" stroke="#475569" stroke-width="1.6" />
  <line x1="19" y1="29" x2="29" y2="29" stroke="#475569" stroke-width="1.5" />
  <line x1="19" y1="35" x2="27" y2="35" stroke="#475569" stroke-width="1.5" />

  <!-- Indicador activo GitSOS -->
  <rect x="2" y="64" width="3" height="34" rx="1.5" fill="#818cf8" />
  <rect x="8" y="64" width="34" height="34" rx="7" fill="#1e1b4b" />
  <line x1="20" y1="71" x2="20" y2="85" stroke="#818cf8" stroke-width="2.2" stroke-linecap="round" />
  <circle cx="20" cy="88.5" r="3" stroke="#818cf8" stroke-width="2.2" />
  <circle cx="31" cy="75.5" r="3" stroke="#818cf8" stroke-width="2.2" />
  <path d="M20 81c0-4 3.5-5.5 8-5.5" stroke="#818cf8" stroke-width="2.2" stroke-linecap="round" />

  <!-- Encabezado del Sidebar -->
  <text x="64" y="28" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700">Guía Interactiva GitSOS</text>
  <text x="64" y="44" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="9.5">Elegí lo que necesitás hacer o buscá una situación.</text>
  <line x1="64" y1="53" x2="462" y2="53" stroke="#1e293b" stroke-width="1" />

  <!-- Buscador -->
  <rect x="64" y="62" width="398" height="26" rx="5" fill="#1e293b" stroke="#334155" stroke-width="1" />
  <circle cx="77" cy="75" r="4.2" stroke="#64748b" stroke-width="1.4" />
  <line x1="80.2" y1="78.2" x2="83.5" y2="81.5" stroke="#64748b" stroke-width="1.4" stroke-linecap="round" />
  <text x="90" y="78.5" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="10">Buscar (ej. commit, rama, stash, conflicto...)</text>

  <!-- Pills de categoría -->
  <rect x="64" y="96" width="44" height="20" rx="10" fill="#4f46e5" />
  <text x="86" y="109.5" text-anchor="middle" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="600">Todas</text>

  <rect x="114" y="96" width="68" height="20" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1" />
  <text x="148" y="109.5" text-anchor="middle" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="9">Emergencias</text>

  <rect x="188" y="96" width="64" height="20" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1" />
  <text x="220" y="109.5" text-anchor="middle" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="9">Flujo diario</text>

  <rect x="258" y="96" width="46" height="20" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1" />
  <text x="281" y="109.5" text-anchor="middle" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="9">Ramas</text>

  <rect x="310" y="96" width="48" height="20" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1" />
  <text x="334" y="109.5" text-anchor="middle" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="9">Remoto</text>

  <!-- Tarjeta 1 expandida: Flujo diario (franja azul) -->
  <rect x="64" y="125" width="398" height="122" rx="6" fill="#172033" stroke="#334155" stroke-width="1" />
  <path d="M64 131a6 6 0 0 1 6-6v122a6 6 0 0 1-6-6V131z" fill="#3b82f6" />
  <text x="78" y="143" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600">Guardar mis cambios (atajo add + commit)</text>
  <rect x="382" y="131" width="68" height="16" rx="8" fill="#0f172a" stroke="#3b82f6" stroke-width="1" />
  <text x="416" y="142" text-anchor="middle" fill="#e2e8f0" font-family="system-ui, -apple-system, sans-serif" font-size="8.5" font-weight="600">Flujo diario</text>
  <text x="78" y="158" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="9">Prepara tus archivos y guarda el commit guiado con Conventional Commits.</text>

  <!-- Bloque de comando -->
  <rect x="78" y="167" width="372" height="34" rx="4" fill="#0b1120" stroke="#1e293b" stroke-width="1" />
  <text x="88" y="181" fill="#38bdf8" font-family="ui-monospace, Consolas, monospace" font-size="9.5">git add .</text>
  <text x="88" y="194" fill="#38bdf8" font-family="ui-monospace, Consolas, monospace" font-size="9.5">git commit -m "tipo(alcance): mensaje"</text>

  <!-- Botones de acción -->
  <rect x="78" y="210" width="122" height="24" rx="4" fill="#4f46e5" />
  <text x="139" y="225.5" text-anchor="middle" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" font-weight="600">Ejecutar en terminal</text>

  <rect x="208" y="210" width="60" height="24" rx="4" fill="#1e293b" stroke="#475569" stroke-width="1" />
  <text x="238" y="225.5" text-anchor="middle" fill="#e2e8f0" font-family="system-ui, -apple-system, sans-serif" font-size="9.5">Copiar</text>

  <!-- Tarjeta 2 colapsada: Emergencias (franja cian + badge Acción delicada rojo/naranja) -->
  <rect x="64" y="255" width="398" height="44" rx="6" fill="#172033" stroke="#334155" stroke-width="1" />
  <path d="M64 261a6 6 0 0 1 6-6v44a6 6 0 0 1-6-6V261z" fill="#06b6d4" />
  <text x="78" y="273" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="600">Deshacer último commit</text>
  <rect x="218" y="261" width="66" height="15" rx="7.5" fill="#0f172a" stroke="#06b6d4" stroke-width="1" />
  <text x="251" y="271.5" text-anchor="middle" fill="#e2e8f0" font-family="system-ui, -apple-system, sans-serif" font-size="8">Emergencias</text>
  <rect x="290" y="261" width="84" height="15" rx="7.5" fill="#0f172a" stroke="#f87171" stroke-width="1" />
  <text x="332" y="271.5" text-anchor="middle" fill="#fecaca" font-family="system-ui, -apple-system, sans-serif" font-size="8" font-weight="600">Acción delicada</text>
  <text x="78" y="289" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="8.8">Hice un commit recién y me equivoqué o faltó incluir un archivo</text>

  <!-- Sección Las 3 Zonas de Git -->
  <rect x="64" y="307" width="398" height="38" rx="6" fill="#172033" stroke="#334155" stroke-width="1" />
  <text x="76" y="324" fill="#e2e8f0" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" font-weight="600">Las 3 Zonas de Git</text>
  <rect x="76" y="329" width="114" height="10" rx="3" fill="#1e293b" />
  <text x="133" y="336.5" text-anchor="middle" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="6.8">Working Directory</text>
  <text x="197" y="337" text-anchor="middle" fill="#818cf8" font-family="system-ui, -apple-system, sans-serif" font-size="8">→</text>
  <rect x="204" y="329" width="114" height="10" rx="3" fill="#1e293b" />
  <text x="261" y="336.5" text-anchor="middle" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="6.8">Staging Area</text>
  <text x="325" y="337" text-anchor="middle" fill="#818cf8" font-family="system-ui, -apple-system, sans-serif" font-size="8">→</text>
  <rect x="332" y="329" width="118" height="10" rx="3" fill="#1e293b" />
  <text x="391" y="336.5" text-anchor="middle" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="6.8">Local Repository</text>
</svg>
